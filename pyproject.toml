[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jsc-review"
version = "0.1.0"
description = "Local-first JSC disclosure and governance review proof of concept"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "types-jsonschema>=4.23,<5",
]
retrieval = [
    "sentence-transformers>=3.3,<4",
    "faiss-cpu>=1.9,<2",
    "onnxruntime>=1.20,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jsc_review = [
    "py.typed",
    "review/policy.json",
    "review/model.json",
    "review/prompt_requirement.txt",
    "retrieval/bm25_config.json",
    "retrieval/dense_config.json",
    "retrieval/rerank_config.json",
    "api/static/reviewer.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["Data", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
